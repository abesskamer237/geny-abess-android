services:
  activation-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DB_PATH: /data/activation.sqlite
      HOST: 0.0.0.0
    volumes:
      - activation-data:/data
    expose:
      - "8080"
    networks:
      - activation
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACTIVATION_DOMAIN: ${ACTIVATION_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - activation-api
    networks:
      - activation
volumes:
  activation-data:
  caddy-data:
  caddy-config:
networks:
  activation:
