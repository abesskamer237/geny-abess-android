name: Build Geny-Abess APK
# Builds and publishes APK artifacts whenever main is updated.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare production signing key
        id: signing
        env:
          GENY_KEYSTORE_BASE64: ${{ secrets.GENY_KEYSTORE_BASE64 }}
          GENY_KEYSTORE_PASSWORD: ${{ secrets.GENY_KEYSTORE_PASSWORD }}
          GENY_KEY_ALIAS: ${{ secrets.GENY_KEY_ALIAS }}
          GENY_KEY_PASSWORD: ${{ secrets.GENY_KEY_PASSWORD }}
        run: |
          if [ -n "$GENY_KEYSTORE_BASE64" ] && [ -n "$GENY_KEYSTORE_PASSWORD" ] && [ -n "$GENY_KEY_ALIAS" ] && [ -n "$GENY_KEY_PASSWORD" ]; then
            echo "$GENY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/geny-release.jks"
            echo "GENY_KEYSTORE_PATH=$RUNNER_TEMP/geny-release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets not configured; building debug APK only."
          fi

      - name: Build signed production APK
        if: steps.signing.outputs.available == 'true'
        env:
          GENY_KEYSTORE_PASSWORD: ${{ secrets.GENY_KEYSTORE_PASSWORD }}
          GENY_KEY_ALIAS: ${{ secrets.GENY_KEY_ALIAS }}
          GENY_KEY_PASSWORD: ${{ secrets.GENY_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Geny-Abess-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload production APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Geny-Abess-production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Explain unsigned production build
        if: steps.signing.outputs.available != 'true'
        run: echo "Production APK not generated. Add GENY_KEYSTORE_BASE64, GENY_KEYSTORE_PASSWORD, GENY_KEY_ALIAS and GENY_KEY_PASSWORD to GitHub Actions secrets."
