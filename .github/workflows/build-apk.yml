name: Build Geny-Abess APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare production signing key
        if: ${{ secrets.GENY_KEYSTORE_BASE64 != '' }}
        env:
          GENY_KEYSTORE_BASE64: ${{ secrets.GENY_KEYSTORE_BASE64 }}
        run: |
          echo "$GENY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/geny-release.jks"
          echo "GENY_KEYSTORE_PATH=$RUNNER_TEMP/geny-release.jks" >> "$GITHUB_ENV"

      - name: Build signed production APK
        if: ${{ secrets.GENY_KEYSTORE_BASE64 != '' && secrets.GENY_KEYSTORE_PASSWORD != '' && secrets.GENY_KEY_ALIAS != '' && secrets.GENY_KEY_PASSWORD != '' }}
        env:
          GENY_KEYSTORE_PASSWORD: ${{ secrets.GENY_KEYSTORE_PASSWORD }}
          GENY_KEY_ALIAS: ${{ secrets.GENY_KEY_ALIAS }}
          GENY_KEY_PASSWORD: ${{ secrets.GENY_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Geny-Abess-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload production APK
        if: ${{ secrets.GENY_KEYSTORE_BASE64 != '' && secrets.GENY_KEYSTORE_PASSWORD != '' && secrets.GENY_KEY_ALIAS != '' && secrets.GENY_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Geny-Abess-production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Explain unsigned production build
        if: ${{ !(secrets.GENY_KEYSTORE_BASE64 != '' && secrets.GENY_KEYSTORE_PASSWORD != '' && secrets.GENY_KEY_ALIAS != '' && secrets.GENY_KEY_PASSWORD != '') }}
        run: echo "Production APK not generated: configure the four GENY_* GitHub Actions secrets to sign a release."
